# Small, fully resolved line: every check returns PASS (no nulls, no warnings).
schema_version: 1
line:
  takt_s: 20.0
  units: {length: m, mass: kg, time: s, angle: rad}
  origin: pallet_datum_round
  work_height: 0.9

parts:
  bottom_plate:
    {source: solidworks, mesh: meshes/drone/bottom_plate.stl, envelope: [0.2, 0.2, 0.003], mass: 0.05,
     datums: {round: [0.0, 0.0], diamond: [0.1, 0.0]}, pick: [0.0, 0.0, 0.003, 0.0],
     # Four arms on the plate diagonals about the plate centre (0.05, 0), two screws each at
     # r = 60 and 80 mm. Deliberately not in arm order: the carrier groups them by angle.
     arm_holes: {per_arm: 2, positions: [[0.092426, 0.042426], [0.007574, 0.042426],
                                         [0.007574, -0.042426], [0.092426, -0.042426],
                                         [0.106569, 0.056569], [-0.006569, 0.056569],
                                         [-0.006569, -0.056569], [0.106569, -0.056569]]}}
  mid_plate:
    {source: solidworks, mesh: meshes/drone/mid_plate.stl, envelope: [0.2, 0.2, 0.003], mass: 0.05,
     datums: {round: [0.0, 0.0], diamond: [0.1, 0.0]}, pick: [0.0, 0.0, 0.003, 0.0],
     z_in_stack: 0.03, lead_slot: [0.006, 0.012]}
  top_plate:
    {source: solidworks, mesh: meshes/drone/top_plate.stl, envelope: [0.2, 0.2, 0.003], mass: 0.05,
     datums: {round: [0.0, 0.0], diamond: [0.1, 0.0]}, pick: [0.0, 0.0, 0.003, 0.0],
     z_in_stack: 0.06}
  arm: {source: primitive, shape: box, dims: [0.16, 0.02, 0.008], mass: 0.09, hole_inset: 0.02}
  esc: {source: primitive, shape: box, dims: [0.04, 0.04, 0.012], mass: 0.03, z_in_stack: 0.045}
  pod: {source: primitive, shape: box, dims: [0.1, 0.08, 0.04], mass: 0.12, carried_by: carrier_pod}
  pallet: {source: build123d, generator: tools/cad/pallet.py, mass: 2.0}
  # No `pick`: on a build123d fixture the pick pose is an output the generator derives.
  carrier_spider: {source: build123d, generator: tools/cad/spider_carrier.py, mass: 0.6}
  carrier_pod: {source: build123d, generator: tools/cad/pod_tray.py, mass: 0.3}

cad: {datum_d: 0.003, press_nut_hole_d: 0.004}

# One arm tooling hole per arm, on the arm axis 52 mm from the plate centre: 8 mm from the nearest
# screw (r = 60), more than 2 x M3.
drone:
  arm_tooling_holes: [[0.086770, 0.036770], [0.013230, 0.036770], [0.013230, -0.036770],
                      [0.086770, -0.036770]]
  tooling_pin_d: 0.003
  pin_engagement: 0.002

fasteners:
  m3_x8: {length: 0.008, d: 0.003, feeder: fd_screw}

# D-013: every source belongs to a station and sits at an offset in its frame (dz = pick plane).
feeders:
  fd_mid_plate: {type: magazine, part: mid_plate, station: st_place, offset: [-0.2, 0.3, 0.15, 0.0], capacity: 20, refill_s: 60.0}
  fd_screw: {type: blow, part: m3_x8, target: gh_top, feed_s: 0.5}

sources:
  src_plate: {output: bottom_plate, buffer: buf_plate, interval_s: 20.0, buffer_capacity: 3}
buffers:
  buf_plate: {station: st_load, offset: [-0.2, 0.3, 0.1, 0.0]}
  buf_fixture: {station: st_spider, offset: [-0.2, 0.3, 0.1, 0.0]}    # spider carriers
  buf_pod: {station: st_pod, offset: [-0.2, 0.3, 0.1, 0.0]}           # pod trays (a buffer no source fills)

# D-013: scara_pod lifts the spider carrier off before it places the pod tray, onto a chute
# that runs out on +x through the fence (x 3.075) back to the carriers' buffer.
return_paths:
  rt_fixture: {carrier: carrier_spider, station: st_pod, kind: chute, offset: [0.2, 0.3, 0.1, 0.0],
               length: 0.6, width: 0.15, sink: buf_fixture}

# A small SCARA: links 0.12 + 0.12 (reach 0.24), j2 limited so it folds in to r_min 0.1 m,
# j1 nearly a full turn.
robot_models:
  test_scara:
    reach: 0.24
    z_stroke: 0.6
    payload_rated: 3.0
    payload_max: 6.0
    joint_limits: {j1: 3.0, j2: 2.281994, j4: 6.283185}
    inertia_rated: 0.02
    repeatability: 0.00002
    link1: 0.12
    link2: 0.12
    motion: {v_max: 1.0, a_max: 2.0, j4_speed: 10.0}

tools:
  tool_plate: {grip: vacuum, dims: [0.12, 0.12, 0.02], mass: 0.3, offset_r: 0.0}
  tool_carrier: {grip: finger, dims: [0.06, 0.06, 0.03], mass: 0.3, offset_r: 0.0}

# One SCARA per pick-and-place station, all on +y, 0.24 m out, facing the line; each source sits
# 0.2 m upstream of its station, 0.3 m out. Reach 0.24 m keeps neighbouring envelopes (0.5 m apart)
# clear.
scaras:
  scara_load: {station: st_load, model: test_scara, offset: [0.0, 0.24, 0.0, -1.570796], tools: []}
  scara_place: {station: st_place, model: test_scara, offset: [0.0, 0.24, 0.0, -1.570796], tools: [tool_plate]}
  scara_spider: {station: st_spider, model: test_scara, offset: [0.0, 0.24, 0.0, -1.570796], tools: [tool_carrier]}
  scara_pod: {station: st_pod, model: test_scara, offset: [0.0, 0.24, 0.0, -1.570796], tools: [tool_carrier]}
scara_defaults: {grip_s: 0.2, release_s: 0.2, settle_s: 0.1, z_margin: 0.03, plan_speed_scale: 0.5}
gang_heads:
  gh_top: {direction: down, spindles: 8, pattern_from: bottom_plate.arm_holes, stroke: 0.05,
           v_max: 0.1, a_max: 0.5, drive_s: 3.0, offset: [0.0, 0.0, 0.0, 0.0]}

conveyor: {pitch: 0.5}
# Anchored 0.5 m apart along +x from the line origin (D-013).
stations:
  st_load:  {index: 1, count: 1, anchor: {after: origin, gap: 0.0}}
  st_place: {index: 2, count: 1, anchor: {after: st_load, gap: 0.5}}
  st_drive: {index: 3, count: 1, anchor: {after: st_place, gap: 0.5}}
  st_test:  {index: 4, count: 5, anchor: {after: st_drive, gap: 0.5}, cell_pitch: 0.4}
  # The two fixture-placing stations. Appended last so the indices of the four steps above,
  # which the failing-case fixtures address by position, do not move.
  st_spider: {index: 5, count: 1, anchor: {after: st_test, gap: 0.5}}
  st_pod:    {index: 6, count: 1, anchor: {after: st_spider, gap: 0.5}}

milestones:
  front: [st_load, st_place, st_drive]
  back:  [st_test, st_spider, st_pod]

sequence:
  - {id: load,  station: st_load,  capability: load,  part: bottom_plate, from: buf_plate, duration_s: 5.0, requires: []}
  - {id: place, station: st_place, capability: place, part: mid_plate, from: fd_mid_plate, tool: tool_plate, duration_s: 6.0, requires: [load]}
  - {id: drive, station: st_drive, capability: drive, head: gh_top, fastener: m3_x8, qty: 8, duration_s: 15.0, requires: [place]}
  - {id: test,  station: st_test,  capability: test,  duration_s: 90.0, requires: [drive]}
  - {id: place_spider, station: st_spider, capability: place, part: carrier_spider, from: buf_fixture,
     tool: tool_carrier, duration_s: 6.0, requires: [load]}
  - {id: remove_spider, station: st_pod, capability: remove, part: carrier_spider,
     tool: tool_carrier, to: rt_fixture, duration_s: 3.0, requires: [place_spider]}
  - {id: place_pod, station: st_pod, capability: place, part: carrier_pod, from: buf_pod,
     tool: tool_carrier, duration_s: 6.0, requires: [remove_spider]}

# Floor plan (tools/cad/layout.py) and the conveyor timing the takt budget needs.
layout:
  conveyor: {width: 0.30, top_height: 0.88, belt_speed: 0.3}
  pallet_block: {length: 0.20, width: 0.20, thickness: 0.02}
  stop_unit_length: 0.20
  stop_unit_cycle_s: 0.5
  buffer_slots_between_stations: 1
  scara_base: {diameter: 0.10, height: 1.2}
  gang_head_box: [0.20, 0.20, 0.15]
  feeder_footprints:
    fd_mid_plate: [0.15, 0.15, 1.05]
    buf_plate: [0.15, 0.15, 1.0]
    buf_fixture: [0.15, 0.15, 1.0]
    buf_pod: [0.15, 0.15, 1.0]
  test_branch: {offset_y: -1.0, cell_w: 0.30, cell_d: 0.30}
  operator_aisle: {side: "+y", width: 1.0}
  guard_offset: 0.3
