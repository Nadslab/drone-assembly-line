[pytest]
testpaths = tests
# A sourced ROS shell puts its site-packages on PYTHONPATH; its pytest plugins need packages
# (lark, ...) that tools/.venv does not have. tools/ tests never use them.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint
