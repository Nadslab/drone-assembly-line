schema_version: 1
line:
  takt_s: 20.2
  units: {length: m, mass: kg, time: s, angle: rad}
  origin: pallet_datum_round
  work_height: null             # m — the datum plane above the floor; station poses are z = 0 on it

# ---------- parts: everything that moves or is gripped ----------
parts:
  bottom_plate:
    source: solidworks            # solidworks | build123d | primitive
    mesh: meshes/drone/bottom_plate.stl
    envelope: [null, null, null]  # x,y,z m — filled by mesh_pipeline.py, checked vs STL
    mass: null
    datums:                       # plate frame; from SolidWorks tooling-hole positions (§7.2)
      round:   [0.0, 0.0]
      diamond: [null, null]
    pick: [0.0, 0.0, null, 0.0]   # x,y,z,yaw in part frame
    arm_holes:                    # arm-sandwich screws (§7.1); gh_arm_sandwich drives all 8
      per_arm: 2                  # -> 8/2 = 4 arms, grouped by angle about the plate centre
      positions: [[null, null], [null, null], [null, null], [null, null],
                  [null, null], [null, null], [null, null], [null, null]]
  mid_plate:     {source: solidworks, mesh: meshes/drone/mid_plate.stl, envelope: [null,null,null], mass: null, datums: {round: [0.0, 0.0], diamond: [null, null]}, pick: [0,0,null,0], z_in_stack: null, lead_slot: [null, null]}
  top_plate:     {source: solidworks, mesh: meshes/drone/top_plate.stl, envelope: [null,null,null], mass: null, datums: {round: [0.0, 0.0], diamond: [null, null]}, pick: [0,0,null,0], z_in_stack: null}
  # key = poka-yoke corner cut [x,y] at the +x,+y corner (§7.5): inside and outside are not
  # interchangeable, so the magazine gets a matching rib and a flipped plate cannot seat (§16).
  side_plate:    {source: solidworks, mesh: meshes/drone/side_plate.stl, envelope: [null,null,null], mass: null, pick: [0,0,null,0], key: [null, null]}
  standoff:      {source: primitive, shape: cylinder, dims: [null, null], mass: null}
  # arm/esc are the spider broken down far enough for the carrier to hold them (§7.10); `spider`
  # stays the lumped box the sim carries. dims = [length, width, thickness] along the arm axis.
  arm:           {source: primitive, shape: box, dims: [null,null,null], mass: null, hole_inset: null}
  esc:           {source: primitive, shape: box, dims: [null,null,null], mass: null, z_in_stack: null}
  spider:        {source: primitive, shape: box, dims: [null,null,null], mass: null, carried_by: carrier_spider}
  pod:           {source: primitive, shape: box, dims: [null,null,null], mass: null, carried_by: carrier_pod}
  # No `pick`: on a build123d fixture the pick pose is an output — the generator derives it from
  # the pick boss it builds and reports it, the way it reports mass.
  carrier_spider: {source: build123d, generator: tools/cad/spider_carrier.py, mass: null}
  carrier_pod:    {source: build123d, generator: tools/cad/pod_tray.py, mass: null}
  pallet:         {source: build123d, generator: tools/cad/pallet.py, mass: null}

# ---------- cad: shared SolidWorks dimensions (gen_sw_params.py -> cad_params.txt) ----------
# z_in_stack (parts.*) = height of the plate's bottom face above the bottom plate (bottom = 0).
# lead_slot (parts.mid_plate) = [width, length] of the motor lead exit slot.
cad:
  datum_d: 0.003                # round/diamond tooling hole, Ø3.0 H7 (plan P3.1)
  press_nut_hole_d: null        # from the press-nut datasheet (CAD guide keeps 4 mm as a variable)

# ---------- drone: features of the assembled drone the line's tooling uses (D-012, D-013) ----------
# The arms are located on the pallet by one tooling pin each, through a dedicated arm tooling hole
# in the bottom plate (same XY) and `pin_engagement` into the arm. The screw holes stay free for
# the gang head. XY in the bottom plate frame. The pins are retractable (D-013): they extend at
# st_build_frame (step extend_pins) and retract at unload, the end-of-line station deferred to
# docs/deferred_stations.yaml (it gets its own actuate step when it is re-added).
drone:
  arm_tooling_holes: [[null, null], [null, null], [null, null], [null, null]]   # one per arm
  tooling_pin_d: null           # m, pin diameter
  pin_engagement: null          # m, pin length into the arm above the bottom plate
  arm_pins: {retractable: true, extend_step: extend_pins, retract_at: unload}

# ---------- fasteners: one feeder per length (§7.9) ----------
# d = nominal thread diameter (M3 = 3 mm); arm_pin_clearance keeps tooling holes 2 x d clear.
fasteners:
  m3_x8:  {length: 0.008, d: 0.003, feeder: fd_screw_m3x8}

# ---------- feeders: fixed pick pose, the SCARA never searches ----------
# D-013: a feeder or buffer belongs to a station and is placed by `offset` [dx, dy, dz, yaw] in
# that station's anchor frame (dz = its pick plane above the datum plane); spec.py derives `pose`.
feeders:
  fd_mid_plate:  {type: magazine,  part: mid_plate,  station: st_build_frame, offset: [null,null,null,0.0], capacity: 20, refill_s: null}
  fd_top_plate:  {type: magazine,  part: top_plate,  station: st_fit_top_plate, offset: [null,null,null,0.0], capacity: 20, refill_s: null}
  # A paired magazine: one left and one right side plate per pick, for side_plate_pair (D-011).
  fd_side_plate: {type: magazine,  part: side_plate, per_pick: 2, station: st_fit_side_plates, offset: [null,null,null,0.0], capacity: 40, refill_s: null}
  # A fixtured nest: all 4 standoffs of one drone come out in one gang pick (D-009).
  fd_standoff:   {type: nest,      part: standoff,   per_pick: 4, station: st_seat_esc, offset: [null,null,null,0.0], capacity: 200, refill_s: null}
  fd_screw_m3x8: {type: blow,      part: m3_x8,      target: gh_arm_sandwich, feed_s: null}

# ---------- sub-line sources (simulated) ----------
sources:
  src_A: {output: spider,       buffer: buf_spider, interval_s: 20.2, buffer_capacity: null}
  src_B: {output: pod,          buffer: buf_pod,    interval_s: 20.2, buffer_capacity: null}
  src_C: {output: bottom_plate, buffer: buf_plate,  interval_s: 20.2, buffer_capacity: null}
buffers:
  buf_spider: {station: st_build_frame, offset: [null,null,null,0.0]}
  buf_pod:    {station: st_fit_pod,     offset: [null,null,null,0.0]}
  buf_plate:  {station: st_load_pallet, offset: [null,null,null,0.0]}

# Empty-carrier return paths (D-013): the SCARA lifts the carrier off the pallet and puts it on a
# chute owned by its station (offset: put-down point, put-down plane z, the direction it runs);
# the chute runs `length` out through the guard to `sink`, the sub-line that refills the carrier.
return_paths:
  rt_carrier_spider: {carrier: carrier_spider, station: st_seat_esc, kind: chute, offset: [null,null,null,null], length: null, width: null, sink: src_A}
  rt_carrier_pod:    {carrier: carrier_pod,    station: st_fit_pod,  kind: chute, offset: [null,null,null,null], length: null, width: null, sink: src_B}

# ---------- equipment ----------
# Robot models (D-013): one SCARA product used everywhere. Values from Epson's LS10-B product
# pages (docs/12 §4); angles in rad (j1 ±132°, j2 ±150°, j4 ±360°). The link split and the
# motion limits are not published in a form we have yet: null until a datasheet/quote gives them.
robot_models:
  epson_ls10b_700_z300:
    vendor: Epson LS10-B, 700 mm, Z 300 mm
    reach: 0.70                     # m, link1 + link2
    z_stroke: 0.30                  # m
    payload_rated: 5.0              # kg
    payload_max: 10.0               # kg
    joint_limits: {j1: 2.303835, j2: 2.617994, j4: 6.283185}   # ±132°, ±150°, ±360°
    inertia_rated: 0.02             # kg m^2 about J4
    repeatability: 0.00002          # m (±0.02 mm, J1+J2)
    step: /mnt/c/Users/Admin/Documents/drone-line-cad/05_vendor/epson_ls10b_700_z300.step
    link1: null                     # m
    link2: null                     # m
    motion: {v_max: null, a_max: null, j4_speed: null}   # TCP m/s, m/s^2; J4 rad/s

# SCARA tools (D-013): one id is one physical tool, listed once. dims = [x, y, reach] the tool
# needs at its pick feature; mass and offset_r (tool axis to the J4 axis) feed the payload and
# wrist_inertia checks. A dual-tool end-effector carries two, 180° apart about J4.
tools:
  tool_carrier_spider: {grip: finger, dims: [null, null, null], mass: null, offset_r: null}
  tool_plate_vacuum:   {grip: vacuum, dims: [null, null, null], mass: null, offset_r: null}
  standoff_gang:       {grip: finger, dims: [null, null, null], mass: null, offset_r: null}   # 4 standoffs in one pick
  tool_carrier_pod:    {grip: finger, dims: [null, null, null], mass: null, offset_r: null}
  side_plate_pair:     {grip: vacuum, dims: [null, null, null], mass: null, offset_r: null}   # left + right side plate in one pick

# One SCARA per pick-and-place station (D-012), keyed scara_<station id without st_>. D-013: each
# names a robot model, its base is placed by `offset` [dx, dy, dz, yaw] in its station's anchor
# frame (dz = the bottom of the TCP's z stroke, yaw = the direction j1 = 0 points), and `tools` is
# its end-effector (one tool, or a dual-tool pair switched by a 180° J4 turn).
scaras:
  scara_build_frame:
    station: st_build_frame
    model: epson_ls10b_700_z300
    offset: [null, null, null, null]
    tools: [tool_carrier_spider, tool_plate_vacuum]     # dual-tool
  scara_seat_esc:
    station: st_seat_esc
    model: epson_ls10b_700_z300
    offset: [null, null, null, null]
    tools: [standoff_gang, tool_carrier_spider]         # dual-tool: standoffs in, carrier off
  scara_fit_pod:
    station: st_fit_pod
    model: epson_ls10b_700_z300
    offset: [null, null, null, null]
    tools: [tool_carrier_pod]                           # places the tray and lifts it off
  scara_fit_side_plates:
    station: st_fit_side_plates
    model: epson_ls10b_700_z300
    offset: [null, null, null, null]
    tools: [side_plate_pair]
  scara_fit_top_plate:
    station: st_fit_top_plate
    model: epson_ls10b_700_z300
    offset: [null, null, null, null]
    tools: [tool_plate_vacuum]
scara_defaults:
  grip_s: null                              # s, tool closes on the part
  release_s: null                           # s, tool lets go
  settle_s: null                            # s, after every Z move
  z_margin: null                            # m, carried part over the tallest item (safe_z)
  plan_speed_scale: null                    # moves planned at this fraction of v_max/a_max
gang_heads:                                 # stroke/v_max/a_max are the ram's joint limits (P5.3)
                                            # drive_s: s per pass, ceil(qty/spindles) passes (D-011)
                                            # slide: at a station with a SCARA too, the head rides a
                                            # slide in from the side opposite the SCARA (D-012)
                                            # offset: its working pose in its station's anchor
                                            # frame (D-013); [0,0,0,0] = the head frame on the
                                            # pallet datum, where the plate's screw pattern is
  gh_arm_sandwich: {direction: down,       spindles: 8, pattern_from: bottom_plate.arm_holes, stroke: null, v_max: null, a_max: null, drive_s: null,
                    slide: {stroke: null, t_in: null, t_out: null}, offset: [0.0, 0.0, 0.0, 0.0]}
  gh_side_plates:  {direction: horizontal, spindles: null, opposed: true, stroke: null, v_max: null, a_max: null, drive_s: null,
                    slide: {stroke: null, t_in: null, t_out: null}, offset: [0.0, 0.0, 0.0, 0.0]}
  # D-010: one gang head per drive step; neither existing pattern fits these screws.
  gh_esc:          {direction: down,       spindles: null, stroke: null, v_max: null, a_max: null, drive_s: null,
                    slide: {stroke: null, t_in: null, t_out: null}, offset: [0.0, 0.0, 0.0, 0.0]}
  gh_pod:          {direction: down,       spindles: null, stroke: null, v_max: null, a_max: null, drive_s: null,
                    slide: {stroke: null, t_in: null, t_out: null}, offset: [0.0, 0.0, 0.0, 0.0]}
  gh_top_plate:    {direction: down,       spindles: null, stroke: null, v_max: null, a_max: null, drive_s: null,
                    slide: {stroke: null, t_in: null, t_out: null}, offset: [0.0, 0.0, 0.0, 0.0]}

# ---------- stations ----------
conveyor: {pitch: null}                     # pallet advance distance; index time = pitch / layout.conveyor.belt_speed (D-010)

# ---------- layout: floor plan for tools/cad/layout.py (SolidWorks review), metres ----------
layout:
  conveyor: {width: null, top_height: null, belt_speed: null}   # top_height: belt top above floor
  pallet_block: {length: null, width: null, thickness: null}    # length along the conveyor
  stop_unit_length: null                    # station footprint along the conveyor
  stop_unit_cycle_s: null                   # s, stop/locate/release, part of every transfer
  buffer_slots_between_stations: null       # queued pallets between two stations
  scara_base: {diameter: null, height: null}   # floor-standing column; height = floor to its top
  gang_head_box: [null, null, null]         # [x, y, z] envelope of a gang head body
  feeder_footprints:                        # [w (x), d (y), h floor to top]; feeders and buffers
    fd_mid_plate:  [null, null, null]
    fd_top_plate:  [null, null, null]
    fd_side_plate: [null, null, null]
    fd_standoff:   [null, null, null]
    buf_spider:    [null, null, null]
    buf_pod:       [null, null, null]
    buf_plate:     [null, null, null]
  operator_aisle: {side: null, width: null}                     # side: "+y" or "-y"
  guard_offset: null                        # robot reach envelopes to the guard line
# actor (D-010): stated only where no step says who works there — operator, or sub_line (which
# loads from `source`); scara, driver and test follow from the steps. null = not decided yet.
# anchor (D-013): a station stands `gap` m along the line (+x) from the datum of the station it
# comes `after`; the first one is the line origin (line.origin). spec.py derives every pose.
stations:
  # Single-purpose loader where returned pallets re-enter the line: sub-line C's bottom plate
  # arrives on the pallet, no SCARA involved (D-010).
  st_load_pallet:          {index: 1, count: 1, anchor: {after: origin, gap: 0.0}, actor: sub_line, source: buf_plate}
  # Station A (D-013): pins extend, spider placed in its carrier, mid plate, arm sandwich driven.
  st_build_frame:          {index: 2, count: 1, anchor: {after: st_load_pallet, gap: null}}
  # B: standoffs (one gang pick), ESC driven, then the spider carrier lifted off and returned.
  st_seat_esc:             {index: 3, count: 1, anchor: {after: st_build_frame, gap: null}}
  # C: pod placed in its tray, driven, tray lifted off and returned.
  st_fit_pod:              {index: 4, count: 1, anchor: {after: st_seat_esc, gap: null}}
  # D: both side plates (paired pick), opposed heads drive; servo mount parked (§15.3).
  st_fit_side_plates:      {index: 5, count: 1, anchor: {after: st_fit_pod, gap: null}}
  # E: top plate placed and driven from above.
  st_fit_top_plate:        {index: 6, count: 1, anchor: {after: st_fit_side_plates, gap: null}}
  # st_audit_torque, st_test, st_pack: deferred to docs/deferred_stations.yaml (D-012).

# Milestones (D-012): every station in exactly one, in line order. layout.py and check_line.py
# take --milestone <name> to build or check one of them on its own.
milestones:
  frame:       [st_load_pallet, st_build_frame]
  electronics: [st_seat_esc, st_fit_pod]
  closeout:    [st_fit_side_plates, st_fit_top_plate]

# ---------- sequence: the beat table ----------
# Order = execution order within one pallet. `requires` = precedence graph (§13 next step 1).
# duration_s = work content at that station; from AnyLogic / line balancing.
sequence:
  - {id: load_pallet,       station: st_load_pallet,        capability: load,    part: bottom_plate, duration_s: null, requires: []}
  # Station A (D-013). The carrier rides along to st_seat_esc: it is placed here, not emptied.
  - {id: extend_pins,       station: st_build_frame,        capability: actuate, device: arm_pins, duration_s: null, requires: [load_pallet]}
  - {id: place_spider,      station: st_build_frame,        capability: place,   part: carrier_spider, from: buf_spider, tool: tool_carrier_spider, duration_s: null, requires: [extend_pins]}
  - {id: place_mid_plate,   station: st_build_frame,        capability: place,   part: mid_plate, from: fd_mid_plate, tool: tool_plate_vacuum, duration_s: null, requires: [place_spider]}
  - {id: drive_arm_sandwich, station: st_build_frame,       capability: drive,   head: gh_arm_sandwich, fastener: m3_x8, qty: 8, duration_s: null, requires: [place_mid_plate]}
  # Station B (D-013). The carrier has ridden here from A; it leaves once the ESC is fastened.
  - {id: install_standoffs, station: st_seat_esc,           capability: place,   part: standoff, from: fd_standoff, tool: standoff_gang, qty: 1, duration_s: null, requires: [drive_arm_sandwich]}
  - {id: drive_esc,         station: st_seat_esc,           capability: drive,   head: gh_esc, qty: 4, duration_s: null, requires: [install_standoffs]}
  - {id: remove_carrier_spider, station: st_seat_esc,       capability: remove,  part: carrier_spider, tool: tool_carrier_spider, to: rt_carrier_spider, duration_s: null, requires: [drive_esc]}
  # Station C.
  - {id: place_pod,         station: st_fit_pod,            capability: place,   part: carrier_pod, from: buf_pod, tool: tool_carrier_pod, duration_s: null, requires: [remove_carrier_spider]}
  - {id: drive_pod,         station: st_fit_pod,            capability: drive,   head: gh_pod, qty: null, duration_s: null, requires: [place_pod]}
  - {id: remove_carrier_pod, station: st_fit_pod,           capability: remove,  part: carrier_pod, tool: tool_carrier_pod, to: rt_carrier_pod, duration_s: null, requires: [drive_pod]}
  # Station D.
  - {id: place_side_plates, station: st_fit_side_plates,    capability: place,   part: side_plate, from: fd_side_plate, tool: side_plate_pair, qty: 1, duration_s: null, requires: [remove_carrier_pod]}
  - {id: drive_side_plates, station: st_fit_side_plates,    capability: drive,   head: gh_side_plates, qty: null, duration_s: null, requires: [place_side_plates]}
  - {id: mount_servo,       station: st_fit_side_plates,    capability: drive,   qty: 2, duration_s: null, requires: [drive_side_plates], status: parked}
  # Station E.
  - {id: place_top_plate,   station: st_fit_top_plate,      capability: place,   part: top_plate, from: fd_top_plate, tool: tool_plate_vacuum, qty: 1, duration_s: null, requires: [drive_side_plates]}
  - {id: drive_top_plate,   station: st_fit_top_plate,      capability: drive,   head: gh_top_plate, qty: 5, duration_s: null, requires: [place_top_plate]}
  # audit_torque, test, pack: deferred to docs/deferred_stations.yaml (D-012).
