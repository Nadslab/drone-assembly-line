schema_version: 1
line:
  takt_s: 20.2
  units: {length: m, mass: kg, time: s, angle: rad}
  origin: pallet_datum_round
  work_height: null             # m — the datum plane above the floor; station poses are z = 0 on it

# ---------- parts: everything that moves or is gripped ----------
parts:
  bottom_plate:
    source: solidworks            # solidworks | build123d | primitive
    mesh: meshes/drone/bottom_plate.stl
    envelope: [null, null, null]  # x,y,z m — filled by mesh_pipeline.py, checked vs STL
    mass: null
    datums:                       # plate frame; from SolidWorks tooling-hole positions (§7.2)
      round:   [0.0, 0.0]
      diamond: [null, null]
    pick: [0.0, 0.0, null, 0.0]   # x,y,z,yaw in part frame
    arm_holes:                    # arm-sandwich screws (§7.1); gh_arm_sandwich drives all 8
      per_arm: 2                  # -> 8/2 = 4 arms, grouped by angle about the plate centre
      positions: [[null, null], [null, null], [null, null], [null, null],
                  [null, null], [null, null], [null, null], [null, null]]
  mid_plate:     {source: solidworks, mesh: meshes/drone/mid_plate.stl, envelope: [null,null,null], mass: null, datums: {round: [0.0, 0.0], diamond: [null, null]}, pick: [0,0,null,0], z_in_stack: null, lead_slot: [null, null]}
  top_plate:     {source: solidworks, mesh: meshes/drone/top_plate.stl, envelope: [null,null,null], mass: null, datums: {round: [0.0, 0.0], diamond: [null, null]}, pick: [0,0,null,0], z_in_stack: null}
  # key = poka-yoke corner cut [x,y] at the +x,+y corner (§7.5): inside and outside are not
  # interchangeable, so the magazine gets a matching rib and a flipped plate cannot seat (§16).
  side_plate:    {source: solidworks, mesh: meshes/drone/side_plate.stl, envelope: [null,null,null], mass: null, pick: [0,0,null,0], key: [null, null]}
  standoff:      {source: primitive, shape: cylinder, dims: [null, null], mass: null}
  # arm/esc are the spider broken down far enough for the carrier to hold them (§7.10); `spider`
  # stays the lumped box the sim carries. dims = [length, width, thickness] along the arm axis.
  arm:           {source: primitive, shape: box, dims: [null,null,null], mass: null, hole_inset: null}
  esc:           {source: primitive, shape: box, dims: [null,null,null], mass: null, z_in_stack: null}
  spider:        {source: primitive, shape: box, dims: [null,null,null], mass: null, carried_by: carrier_spider}
  pod:           {source: primitive, shape: box, dims: [null,null,null], mass: null, carried_by: carrier_pod}
  # No `pick`: on a build123d fixture the pick pose is an output — the generator derives it from
  # the pick boss it builds and reports it, the way it reports mass.
  carrier_spider: {source: build123d, generator: tools/cad/spider_carrier.py, mass: null}
  carrier_pod:    {source: build123d, generator: tools/cad/pod_tray.py, mass: null}
  pallet:         {source: build123d, generator: tools/cad/pallet.py, mass: null}

# ---------- cad: shared SolidWorks dimensions (gen_sw_params.py -> cad_params.txt) ----------
# z_in_stack (parts.*) = height of the plate's bottom face above the bottom plate (bottom = 0).
# lead_slot (parts.mid_plate) = [width, length] of the motor lead exit slot.
cad:
  datum_d: 0.003                # round/diamond tooling hole, Ø3.0 H7 (plan P3.1)
  press_nut_hole_d: null        # from the press-nut datasheet (CAD guide keeps 4 mm as a variable)

# ---------- fasteners: one feeder per length (§7.9) ----------
fasteners:
  m3_x8:  {length: 0.008, feeder: fd_screw_m3x8}

# ---------- feeders: fixed pick pose, the gantry never searches ----------
feeders:
  fd_mid_plate:  {type: magazine,  part: mid_plate,  pose: [null,null,null,0], capacity: 20, refill_s: null}
  fd_top_plate:  {type: magazine,  part: top_plate,  pose: [null,null,null,0], capacity: 20, refill_s: null}
  fd_side_plate: {type: magazine,  part: side_plate, pose: [null,null,null,0], capacity: 40, refill_s: null}
  # A fixtured nest: all 4 standoffs of one drone come out in one gang pick (D-009).
  fd_standoff:   {type: nest,      part: standoff,   per_pick: 4, pose: [null,null,null,0], capacity: 200, refill_s: null}
  fd_screw_m3x8: {type: blow,      part: m3_x8,      target: gh_arm_sandwich, feed_s: null}

# ---------- sub-line sources (simulated) ----------
sources:
  src_A: {output: spider,       buffer: buf_spider, interval_s: 20.2, buffer_capacity: null}
  src_B: {output: pod,          buffer: buf_pod,    interval_s: 20.2, buffer_capacity: null}
  src_C: {output: bottom_plate, buffer: buf_plate,  interval_s: 20.2, buffer_capacity: null}
buffers:
  buf_spider: {pose: [null,null,null,0]}
  buf_pod:    {pose: [null,null,null,0]}
  buf_plate:  {pose: [null,null,null,0]}

# ---------- equipment ----------
# One gantry per zone (D-008); zones never overlap. Axis limits are in the gantry's own frame
# (pose - mount) and drive the xacro, the reach check and estimate_moves.py.
# tools: dims = [x, y, reach] the tool needs at a pick feature; one id is one tool on every gantry.
gantries:
  gantry_1:
    zone: null                              # [station ids] this gantry serves
    axes:
      x: {min: null, max: null, v_max: null, a_max: null}
      y: {min: null, max: null, v_max: null, a_max: null}
      z: {min: null, max: null, v_max: null, a_max: null}
      c: {min: -3.1416, max: 3.1416, v_max: null, a_max: null}   # delete if no yaw needed
    tools:
      tool_plate:   {grip: vacuum, dims: [null, null, null]}
      tool_carrier: {grip: finger, dims: [null, null, null]}
    mount: [null, null, null]               # gantry base in line frame
  gantry_2:
    zone: null
    axes:
      x: {min: null, max: null, v_max: null, a_max: null}
      y: {min: null, max: null, v_max: null, a_max: null}
      z: {min: null, max: null, v_max: null, a_max: null}
      c: {min: -3.1416, max: 3.1416, v_max: null, a_max: null}
    tools:
      tool_carrier:  {grip: finger, dims: [null, null, null]}
      standoff_gang: {grip: finger, dims: [null, null, null]}   # 4 standoffs in one pick
    mount: [null, null, null]
  gantry_3:
    zone: null
    axes:
      x: {min: null, max: null, v_max: null, a_max: null}
      y: {min: null, max: null, v_max: null, a_max: null}
      z: {min: null, max: null, v_max: null, a_max: null}
      c: {min: -3.1416, max: 3.1416, v_max: null, a_max: null}
    tools:
      tool_plate:   {grip: vacuum, dims: [null, null, null]}
    mount: [null, null, null]
gantry_defaults:
  grip_s: null                              # s, tool closes on the part
  release_s: null                           # s, tool lets go
  settle_s: null                            # s, after every Z move
  z_margin: null                            # m, carried part over the tallest item (safe_z, D-009)
  plan_speed_scale: null                    # moves planned at this fraction of v_max/a_max (D-007)
  damping: 5.0                              # N*s/m, x/y/z joints (D-002)
  friction: 0.5                             # N, x/y/z joints (D-002)
gang_heads:                                 # stroke/v_max/a_max are the ram's joint limits (P5.3)
  gh_arm_sandwich: {direction: down,       spindles: 8, pattern_from: bottom_plate.arm_holes, stroke: null, v_max: null, a_max: null}
  gh_side_plates:  {direction: horizontal, spindles: null, opposed: true, stroke: null, v_max: null, a_max: null}
  # D-010: one gang head per drive step; neither existing pattern fits these screws.
  gh_seat_esc:     {direction: down,       spindles: null, stroke: null, v_max: null, a_max: null}
  gh_top_plate:    {direction: down,       spindles: null, stroke: null, v_max: null, a_max: null}
scaras: {}                                  # add only where screw position varies

# ---------- stations ----------
conveyor: {pitch: null}                     # pallet advance distance; index time = pitch / layout.conveyor.belt_speed (D-010)

# ---------- layout: floor plan for tools/cad/layout.py (SolidWorks review), metres ----------
layout:
  conveyor: {width: null, top_height: null, belt_speed: null}   # top_height: belt top above floor
  pallet_block: {length: null, width: null, thickness: null}    # length along the conveyor
  stop_unit_length: null                    # station footprint along the conveyor
  stop_unit_cycle_s: null                   # s, stop/locate/release, part of every transfer
  buffer_slots_between_stations: null       # queued pallets between two stations
  gantry_frame: {post_size: null, beam_height: null, beam_depth: null,
                 conveyor_clearance: null}  # post footprint to the conveyor edge
  feeder_footprints:                        # [w (x), d (y), h floor to top]; feeders and buffers
    fd_mid_plate:  [null, null, null]
    fd_top_plate:  [null, null, null]
    fd_side_plate: [null, null, null]
    fd_standoff:   [null, null, null]
    buf_spider:    [null, null, null]
    buf_pod:       [null, null, null]
    buf_plate:     [null, null, null]
  test_branch: {offset_y: null, cell_w: null, cell_d: null}     # cells step away from the line in y
  operator_aisle: {side: null, width: null}                     # side: "+y" or "-y"
  guard_offset: null                        # gantry travel envelope to the guard line
# actor (D-010): stated only where no step says who works there — operator, or sub_line (which
# loads from `source`); gantry, driver and test follow from the steps. null = not decided yet.
stations:
  # Single-purpose loader where returned pallets re-enter the line: sub-line C's bottom plate
  # arrives on the pallet, no gantry involved (D-010).
  st_pallet_loader:        {index: 1,  count: 1, pose: [null,null,null,0], actor: sub_line, source: buf_plate}
  st_place_spider:         {index: 2,  count: 1, pose: [null,null,null,0]}
  st_place_mid_plate:      {index: 3,  count: 1, pose: [null,null,null,0]}
  st_drive_arm_sandwich:   {index: 4,  count: 1, pose: [null,null,null,0]}
  st_install_standoffs:    {index: 5,  count: 1, pose: [null,null,null,0]}
  st_seat_esc:             {index: 6,  count: 1, pose: [null,null,null,0]}
  st_place_pod:            {index: 7,  count: 1, pose: [null,null,null,0]}
  st_fit_side_plates:      {index: 8,  count: 1, pose: [null,null,null,0]}
  st_mount_servo:          {index: 9,  count: 1, pose: [null,null,null,0]}   # parked (§15.3)
  st_fit_top_plate:        {index: 10, count: 1, pose: [null,null,null,0]}
  st_audit_torque:         {index: 11, count: 1, pose: [null,null,null,0], actor: null}
  st_test:                 {index: 12, count: 5, pose: [null,null,null,0], cell_pitch: null}
  st_pack:                 {index: 13, count: 1, pose: [null,null,null,0], actor: null}

# ---------- sequence: the beat table ----------
# Order = execution order within one pallet. `requires` = precedence graph (§13 next step 1).
# duration_s = work content at that station; from AnyLogic / line balancing.
sequence:
  - {id: load_pallet,       station: st_pallet_loader,      capability: load,    part: bottom_plate, duration_s: null, requires: []}
  - {id: place_spider,      station: st_place_spider,       capability: place,   part: carrier_spider, from: buf_spider, tool: tool_carrier, duration_s: null, requires: [load_pallet]}
  - {id: place_mid_plate,   station: st_place_mid_plate,    capability: place,   part: mid_plate, from: fd_mid_plate, tool: tool_plate, duration_s: null, requires: [place_spider]}
  - {id: drive_arm_sandwich, station: st_drive_arm_sandwich, capability: drive,  head: gh_arm_sandwich, fastener: m3_x8, qty: 8, duration_s: null, requires: [place_mid_plate]}
  - {id: install_standoffs, station: st_install_standoffs,  capability: place,   part: standoff, from: fd_standoff, tool: standoff_gang, qty: 1, duration_s: null, requires: [drive_arm_sandwich]}
  - {id: seat_esc,          station: st_seat_esc,           capability: drive,   head: gh_seat_esc, qty: 4, duration_s: null, requires: [install_standoffs], note: "releases carrier_spider"}
  - {id: place_pod,         station: st_place_pod,          capability: place,   part: carrier_pod, from: buf_pod, tool: tool_carrier, duration_s: null, requires: [seat_esc]}
  - {id: place_side_plates, station: st_fit_side_plates,    capability: place,   part: side_plate, from: fd_side_plate, tool: tool_plate, qty: 2, duration_s: null, requires: [place_pod]}
  - {id: fit_side_plates,   station: st_fit_side_plates,    capability: drive,   head: gh_side_plates, qty: null, duration_s: null, requires: [place_side_plates]}
  - {id: mount_servo,       station: st_mount_servo,        capability: drive,   qty: 2, duration_s: null, requires: [fit_side_plates], status: parked}
  - {id: place_top_plate,   station: st_fit_top_plate,      capability: place,   part: top_plate, from: fd_top_plate, tool: tool_plate, qty: 1, duration_s: null, requires: [fit_side_plates]}
  - {id: drive_top_plate,   station: st_fit_top_plate,      capability: drive,   head: gh_top_plate, qty: 5, duration_s: null, requires: [place_top_plate]}
  - {id: audit_torque,      station: st_audit_torque,       capability: inspect, duration_s: null, requires: [drive_top_plate]}
  - {id: test,              station: st_test,               capability: test,    duration_s: 90,  requires: [audit_torque]}
  - {id: pack,              station: st_pack,               capability: pack,    duration_s: null, requires: [test]}
