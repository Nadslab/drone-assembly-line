# Dev overlay for line_spec.yaml. Loaded only with --dev (load_spec(dev=True)).
#
# Same structure as the base spec, but it holds ONLY placeholders for values that are null (or
# absent optional fields) there. A value that is not null in line_spec.yaml always wins, so
# nothing here can override a real number. Every placeholder carries "# PLACEHOLDER"; delete
# the line once the real value lands in line_spec.yaml. No deliverable number may come from
# this file (see CLAUDE.md). `null` inside a list means "no opinion for this element".
#
# Layout assumptions: stations on a straight line along +x at 0.6 m pitch from station 1 (the
# origin, y = 0); feeders 0.3 m to +y of their station, buffers 0.3 m to -y; gantry mounted at
# y = -0.5 so its 0-1 m y axis is centred on the line.

