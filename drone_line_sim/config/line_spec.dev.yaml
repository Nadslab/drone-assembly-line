# Dev overlay for line_spec.yaml. Loaded only with --dev (load_spec(dev=True)).
#
# Same structure as the base spec, but it holds ONLY placeholders for values that are null (or
# absent optional fields) there. A value that is not null in line_spec.yaml always wins, so
# nothing here can override a real number. Every placeholder carries "# PLACEHOLDER"; delete
# the line once the real value lands in line_spec.yaml. No deliverable number may come from
# this file (see CLAUDE.md). `null` inside a list means "no opinion for this element".
#
# Layout assumptions: stations on a straight line along +x at 0.6 m pitch from station 1 (the
# origin, y = 0); feeders 0.3 m to +y of their station, buffers 0.3 m to -y; each SCARA base
# stands 0.55 m out on its source's side (D-012). Every pose below is on the datum plane,
# so a station is z = 0 and `line.work_height` alone says how high off the floor the line stands.

line:
  work_height: 0.95                      # PLACEHOLDER

parts:
  bottom_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    # Four arms on the plate diagonals, two screws each at r = 55 and 75 mm from the plate
    # centre (the datum midpoint, 45 mm out on +x). Listed arm by arm, but the generator
    # groups them by angle and never relies on the order.
    arm_holes:
      positions:
        - [0.083891, 0.038891]           # PLACEHOLDER
        - [0.098033, 0.053033]           # PLACEHOLDER
        - [0.006109, 0.038891]           # PLACEHOLDER
        - [-0.008033, 0.053033]          # PLACEHOLDER
        - [0.006109, -0.038891]          # PLACEHOLDER
        - [-0.008033, -0.053033]         # PLACEHOLDER
        - [0.083891, -0.038891]          # PLACEHOLDER
        - [0.098033, -0.053033]          # PLACEHOLDER
  mid_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.03                     # PLACEHOLDER
    lead_slot: [0.006, 0.012]            # PLACEHOLDER
  top_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.06                     # PLACEHOLDER
  side_plate:
    envelope: [0.10, 0.05, 0.003]        # PLACEHOLDER
    mass: 0.02                           # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    key: [0.008, 0.008]                  # PLACEHOLDER
  standoff:
    dims: [0.003, 0.012]                 # PLACEHOLDER
    mass: 0.002                          # PLACEHOLDER
  arm:
    dims: [0.16, 0.02, 0.008]            # PLACEHOLDER
    mass: 0.09                           # PLACEHOLDER
    hole_inset: 0.02                     # PLACEHOLDER
  esc:
    dims: [0.04, 0.04, 0.012]            # PLACEHOLDER
    mass: 0.03                           # PLACEHOLDER
    z_in_stack: 0.045                    # PLACEHOLDER (standoff height above the mid plate)
  spider:
    dims: [0.18, 0.18, 0.03]             # PLACEHOLDER
    mass: 0.15                           # PLACEHOLDER
  pod:
    dims: [0.10, 0.08, 0.04]             # PLACEHOLDER
    mass: 0.12                           # PLACEHOLDER
  carrier_spider:
    mass: 0.3                            # PLACEHOLDER
  carrier_pod:
    mass: 0.2                            # PLACEHOLDER
  pallet:
    mass: 2.0                            # PLACEHOLDER

cad:
  press_nut_hole_d: 0.004                # PLACEHOLDER

# One tooling hole per arm at its root, on the arm axis 48 mm from the plate centre: the arm's
# inboard end is at 45 mm (holes at 55/75, hole_inset 20), and the nearest screw is 7 mm away,
# more than 2 x M3 (arm_pin_clearance).
drone:
  arm_tooling_holes:
    - [0.078941, 0.033941]               # PLACEHOLDER
    - [0.011059, 0.033941]               # PLACEHOLDER
    - [0.011059, -0.033941]              # PLACEHOLDER
    - [0.078941, -0.033941]              # PLACEHOLDER
  tooling_pin_d: 0.003                   # PLACEHOLDER
  pin_engagement: 0.002                  # PLACEHOLDER

feeders:
  fd_mid_plate:
    pose: [1.2, 0.3, 0.1, null]          # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_top_plate:
    pose: [5.4, 0.3, 0.1, null]          # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_side_plate:
    pose: [4.2, 0.3, 0.17, null]         # PLACEHOLDER (218 mm magazine clears the frame top)
    refill_s: 60.0                       # PLACEHOLDER
  fd_standoff:
    pose: [2.4, 0.3, 0.15, null]         # PLACEHOLDER (nest pick plane)
    refill_s: 300.0                      # PLACEHOLDER
  fd_screw_m3x8:
    feed_s: 0.5                          # PLACEHOLDER

sources:
  src_A:
    buffer_capacity: 3                   # PLACEHOLDER
  src_B:
    buffer_capacity: 3                   # PLACEHOLDER
  src_C:
    buffer_capacity: 3                   # PLACEHOLDER
buffers:
  buf_spider:
    pose: [0.6, -0.3, 0.1, null]         # PLACEHOLDER
  buf_pod:
    pose: [3.6, -0.3, 0.1, null]         # PLACEHOLDER
  buf_plate:
    pose: [0.0, -0.3, 0.1, null]         # PLACEHOLDER

# SCARAs (D-012): one per pick-and-place station. Each base stands at its station's x, on the
# side of its part source, 0.55 m out: the feeders/buffers sit 0.3 m out with footprints up to
# 0.194 m, so a 0.2 m base fits only beyond them, and 0.55 m keeps the place pose inside r_max.
scaras:
  # spider from buf_spider (-y)
  scara_place_spider:
    base_side: "-y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      spider_gripper:
        dims: [0.20, 0.20, 0.02]         # PLACEHOLDER (4 fingers on the arm X)
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
  # mid plate from fd_mid_plate (+y)
  scara_place_mid_plate:
    base_side: "+y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      tool_plate:
        dims: [0.12, 0.12, 0.02]         # PLACEHOLDER
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
  # standoffs from fd_standoff (+y)
  scara_install_standoffs:
    base_side: "+y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      standoff_gang:
        dims: [0.10, 0.10, 0.015]        # PLACEHOLDER (4-finger gang over the standoff square)
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
  # pod tray from buf_pod (-y)
  scara_place_pod:
    base_side: "-y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      tool_carrier:
        dims: [0.06, 0.06, 0.03]         # PLACEHOLDER
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
  # side plate pair from fd_side_plate (+y)
  scara_fit_side_plates:
    base_side: "+y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      side_plate_pair:
        dims: [0.12, 0.14, 0.02]         # PLACEHOLDER (two 0.10 x 0.05 plates side by side)
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
  # top plate from fd_top_plate (+y)
  scara_fit_top_plate:
    base_side: "+y"                    # PLACEHOLDER (the side of its part source)
    base_offset_y: 0.55                  # PLACEHOLDER (beyond its feeder/buffer footprint)
    reach:
      r_min: 0.15                        # PLACEHOLDER
      r_max: 0.6                         # PLACEHOLDER
    z_stroke: 0.2                        # PLACEHOLDER
    payload_kg: 3.0                      # PLACEHOLDER
    tools:
      tool_plate:
        dims: [0.12, 0.12, 0.02]         # PLACEHOLDER
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
scara_defaults:
