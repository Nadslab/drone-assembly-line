    stroke: 0.05                         # PLACEHOLDER
    v_max: 0.10                          # PLACEHOLDER (m/s, ram)
    a_max: 0.50                          # PLACEHOLDER (m/s^2, ram)
    drive_s: 3.0                         # PLACEHOLDER (s per pass)
    slide:
      stroke: 0.25                       # PLACEHOLDER
      t_in: 0.5                          # PLACEHOLDER
      t_out: 0.5                         # PLACEHOLDER
  gh_seat_esc:
