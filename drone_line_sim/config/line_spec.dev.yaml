# Entries match the base sequence by position (`id` is checked). Every step is alone at its
# station, so each duration is also the station's load; all are under the 20.2 s takt.
sequence:
  - id: load_pallet
    duration_s: 6.0                      # PLACEHOLDER
  - id: place_spider
    duration_s: 8.0                      # PLACEHOLDER
  - id: place_mid_plate
    duration_s: 8.0                      # PLACEHOLDER
  - id: drive_arm_sandwich
    duration_s: 15.0                     # PLACEHOLDER
  - id: install_standoffs
    duration_s: 12.0                     # PLACEHOLDER
  - id: seat_esc
    duration_s: 10.0                     # PLACEHOLDER
  - id: place_pod
    duration_s: 9.0                      # PLACEHOLDER
  - id: place_side_plates
    duration_s: 4.0                      # PLACEHOLDER (one pair pick, like place_top_plate)
  - id: fit_side_plates
    duration_s: 14.0                     # PLACEHOLDER
    qty: 8                               # PLACEHOLDER
  - id: mount_servo
    duration_s: 5.0                      # PLACEHOLDER
  - id: place_top_plate
    duration_s: 4.0                      # PLACEHOLDER (was fit_top_plate 14 s, split)
  - id: drive_top_plate
    duration_s: 10.0                     # PLACEHOLDER
