# Entries match the base sequence by position (`id` is checked).
sequence:
  - id: load_pallet
    duration_s: 6.0                      # PLACEHOLDER
  - id: extend_pins
    duration_s: 0.5                      # PLACEHOLDER (pin cylinders out; counted in station_time)
  - id: place_spider
    duration_s: 4.0                      # PLACEHOLDER
  - id: place_mid_plate
    duration_s: 4.0                      # PLACEHOLDER
  - id: drive_arm_sandwich
    duration_s: 4.0                      # PLACEHOLDER (one pass + slide in/out)
  - id: install_standoffs
    duration_s: 4.0                      # PLACEHOLDER
  - id: drive_esc
    duration_s: 4.0                      # PLACEHOLDER
  - id: remove_carrier_spider
    duration_s: 4.0                      # PLACEHOLDER
  - id: place_pod
    duration_s: 4.0                      # PLACEHOLDER
  - id: drive_pod
    duration_s: 4.0                      # PLACEHOLDER
    qty: 4                               # PLACEHOLDER (pod screws, gap B)
  - id: remove_carrier_pod
    duration_s: 4.0                      # PLACEHOLDER
  - id: place_side_plates
    duration_s: 4.0                      # PLACEHOLDER (one pair pick)
  - id: drive_side_plates
    duration_s: 7.0                      # PLACEHOLDER (two passes + slide)
    qty: 8                               # PLACEHOLDER
  - id: mount_servo
    duration_s: 5.0                      # PLACEHOLDER
  - id: place_top_plate
    duration_s: 4.0                      # PLACEHOLDER
  - id: drive_top_plate
    duration_s: 4.0                      # PLACEHOLDER
