# Return chutes: put down beside the SCARA on the free side of its cell, running out on -y
# through the guard to the sub-line (1.4 m clears the fence 1.45 m out).
return_paths:
  rt_carrier_spider:
    offset: [-0.35, -0.25, 0.1, -1.570796]   # PLACEHOLDER
    length: 1.4                          # PLACEHOLDER
    width: 0.25                          # PLACEHOLDER (carrier 227 mm square)
  rt_carrier_pod:
    offset: [0.35, -0.25, 0.1, -1.570796]    # PLACEHOLDER
    length: 1.4                          # PLACEHOLDER
    width: 0.20                          # PLACEHOLDER

# Motion (D-014): v_max/a_max derived from standard_cycle by estimate_moves.py --calibrate, keeping
# the earlier dev ratio a_max / v_max = 10 / 2 (that ratio is the placeholder in them).
robot_models:
  epson_ls10b_700_z300:
    motion:
      v_max: 14.2089                     # PLACEHOLDER (derived from standard_cycle; m/s, TCP)
      a_max: 71.0444                     # PLACEHOLDER (derived from standard_cycle; m/s^2, TCP)
      j4_speed: 20.0                     # PLACEHOLDER (rad/s, times the dual-tool switch)

tools:
  tool_carrier_spider:
    dims: [0.06, 0.06, 0.03]             # PLACEHOLDER (jaws on the carrier's pick boss)
