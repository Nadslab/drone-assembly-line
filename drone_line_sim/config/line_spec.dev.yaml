# Frame rule (D-009), in each gantry's own frame (pose - mount): x covers its zone's stations,
# feeders and buffers plus 0.1 m (mount x = the zone's lowest x - 0.1, so x starts at 0); y covers
# those items plus 0.1 m AND the whole conveyor (+-layout.conveyor.width/2 + 0.1 m), so the posts
# outside the travel clear the belt by gantry_frame.conveyor_clearance. x/y/z joints take
# damping/friction from gantry_defaults; C keeps its own rotary values.
gantries:
  # x 0.6-1.2 m (line frame): spider, mid plate (D-010: the pallet loader took load_pallet)
  gantry_1:
    zone: [st_place_spider, st_place_mid_plate]   # PLACEHOLDER
    axes:
      x:
        min: 0.0                         # PLACEHOLDER
        max: 0.8                         # PLACEHOLDER
        v_max: 1.0                       # PLACEHOLDER
        a_max: 3.0                       # PLACEHOLDER
        position_gain: 0.1               # PLACEHOLDER (D-002)
      y:
        min: 0.1                         # PLACEHOLDER
        max: 0.9                         # PLACEHOLDER
        v_max: 1.0                       # PLACEHOLDER
        a_max: 3.0                       # PLACEHOLDER
        position_gain: 0.1               # PLACEHOLDER (D-002)
      z:
        min: 0.0                         # PLACEHOLDER
        max: 0.3                         # PLACEHOLDER
        v_max: 1.0                       # PLACEHOLDER
        a_max: 3.0                       # PLACEHOLDER
        position_gain: 0.1               # PLACEHOLDER (D-002)
      c:
        v_max: 3.0                       # PLACEHOLDER (rad/s)
        a_max: 10.0                      # PLACEHOLDER (rad/s^2)
        damping: 0.5                     # PLACEHOLDER (D-002, rotary: N*m*s/rad)
        friction: 0.05                   # PLACEHOLDER (D-002, rotary: N*m)
        position_gain: 0.1               # PLACEHOLDER (D-002)
    tools:
      tool_plate:
        dims: [0.12, 0.12, 0.02]         # PLACEHOLDER
      tool_carrier:
        dims: [0.06, 0.06, 0.03]         # PLACEHOLDER
    mount: [0.5, -0.5, 0.0]              # PLACEHOLDER
  # x 2.4-3.6 m: standoffs, pod
  gantry_2:
