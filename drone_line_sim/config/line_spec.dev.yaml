# Dev overlay for line_spec.yaml. Loaded only with --dev (load_spec(dev=True)).
#
# Same structure as the base spec, but it holds ONLY placeholders for values that are null (or
# absent optional fields) there. A value that is not null in line_spec.yaml always wins, so
# nothing here can override a real number. Every placeholder carries "# PLACEHOLDER"; delete
# the line once the real value lands in line_spec.yaml. No deliverable number may come from
# this file (see CLAUDE.md). `null` inside a list means "no opinion for this element".
#
# Layout assumptions (D-013: everything is an anchor gap or an offset in a station's frame, the
# poses are derived): stations on a straight line along +x from station 1 (the origin, y = 0).
# Station A (st_build_frame) is a cell of its own: its SCARA stands 0.45 m out on -y facing the
# line, its buffer and magazine 0.35 m either side of it in x, 0.25 m out on -y, and its gang head
# waits on its slide on +y. The other stations keep the D-012 pattern (feeders 0.3 m to +y,
# buffers 0.3 m to -y, the SCARA 0.55 m out on its source's side) until phase 2 re-plans them.
# Every offset z is on the datum plane, so `line.work_height` alone says how high the line stands.

line:
  work_height: 0.95                      # PLACEHOLDER

parts:
  bottom_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    # Four arms on the plate diagonals, two screws each at r = 55 and 75 mm from the plate
    # centre (the datum midpoint, 45 mm out on +x). Listed arm by arm, but the generator
    # groups them by angle and never relies on the order.
    arm_holes:
      positions:
        - [0.083891, 0.038891]           # PLACEHOLDER
        - [0.098033, 0.053033]           # PLACEHOLDER
        - [0.006109, 0.038891]           # PLACEHOLDER
        - [-0.008033, 0.053033]          # PLACEHOLDER
        - [0.006109, -0.038891]          # PLACEHOLDER
        - [-0.008033, -0.053033]         # PLACEHOLDER
        - [0.083891, -0.038891]          # PLACEHOLDER
        - [0.098033, -0.053033]          # PLACEHOLDER
  mid_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.03                     # PLACEHOLDER
    lead_slot: [0.006, 0.012]            # PLACEHOLDER
  top_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.06                     # PLACEHOLDER
  side_plate:
    envelope: [0.10, 0.05, 0.003]        # PLACEHOLDER
    mass: 0.02                           # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    key: [0.008, 0.008]                  # PLACEHOLDER
  standoff:
    dims: [0.003, 0.012]                 # PLACEHOLDER
    mass: 0.002                          # PLACEHOLDER
  arm:
    dims: [0.16, 0.02, 0.008]            # PLACEHOLDER
    mass: 0.09                           # PLACEHOLDER
    hole_inset: 0.02                     # PLACEHOLDER
  esc:
    dims: [0.04, 0.04, 0.012]            # PLACEHOLDER
    mass: 0.03                           # PLACEHOLDER
    z_in_stack: 0.045                    # PLACEHOLDER (standoff height above the mid plate)
  spider:
    dims: [0.18, 0.18, 0.03]             # PLACEHOLDER
    mass: 0.15                           # PLACEHOLDER
  pod:
    dims: [0.10, 0.08, 0.04]             # PLACEHOLDER
    mass: 0.12                           # PLACEHOLDER
  carrier_spider:
    mass: 0.3                            # PLACEHOLDER
  carrier_pod:
    mass: 0.2                            # PLACEHOLDER
  pallet:
    mass: 2.0                            # PLACEHOLDER

cad:
  press_nut_hole_d: 0.004                # PLACEHOLDER

# One tooling hole per arm at its root, on the arm axis 48 mm from the plate centre: the arm's
# inboard end is at 45 mm (holes at 55/75, hole_inset 20), and the nearest screw is 7 mm away,
# more than 2 x M3 (arm_pin_clearance).
drone:
  arm_tooling_holes:
    - [0.078941, 0.033941]               # PLACEHOLDER
    - [0.011059, 0.033941]               # PLACEHOLDER
    - [0.011059, -0.033941]              # PLACEHOLDER
    - [0.078941, -0.033941]              # PLACEHOLDER
  tooling_pin_d: 0.003                   # PLACEHOLDER
  pin_engagement: 0.002                  # PLACEHOLDER

feeders:
  fd_mid_plate:
    offset: [0.35, -0.25, 0.1, null]     # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_top_plate:
    offset: [0.0, 0.3, 0.1, null]        # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_side_plate:
    offset: [0.0, 0.3, 0.17, null]       # PLACEHOLDER (218 mm magazine clears the frame top)
    refill_s: 60.0                       # PLACEHOLDER
  fd_standoff:
    offset: [0.0, 0.3, 0.15, null]       # PLACEHOLDER (nest pick plane)
    refill_s: 300.0                      # PLACEHOLDER
  fd_screw_m3x8:
    feed_s: 0.5                          # PLACEHOLDER

sources:
  src_A:
    buffer_capacity: 3                   # PLACEHOLDER
  src_B:
    buffer_capacity: 3                   # PLACEHOLDER
  src_C:
    buffer_capacity: 3                   # PLACEHOLDER
buffers:
  buf_spider:
    offset: [-0.35, -0.25, 0.1, null]    # PLACEHOLDER
  buf_pod:
    offset: [0.0, -0.3, 0.1, null]       # PLACEHOLDER
  buf_plate:
    offset: [0.0, -0.3, 0.1, null]       # PLACEHOLDER

# The Epson's link split and motion limits are not in the spec yet (docs/12 §4). Note: the vendor
# STEP's joint axes measure ~0.325 / 0.375 m, not this split (D-013) — settle it from the datasheet.
robot_models:
  epson_ls10b_700_z300:
    link1: 0.425                         # PLACEHOLDER
    link2: 0.275                         # PLACEHOLDER
    motion:
      v_max: 2.0                         # PLACEHOLDER (m/s, TCP)
      a_max: 10.0                        # PLACEHOLDER (m/s^2, TCP)
      j4_speed: 20.0                     # PLACEHOLDER (rad/s, times the dual-tool switch)

tools:
  tool_carrier_spider:
    dims: [0.06, 0.06, 0.03]             # PLACEHOLDER (jaws on the carrier's pick boss)
    mass: 0.8                            # PLACEHOLDER
    offset_r: 0.05                       # PLACEHOLDER (dual-tool, 180° from tool_plate_vacuum)
  tool_plate_vacuum:
    dims: [0.12, 0.12, 0.02]             # PLACEHOLDER
    mass: 0.85                           # PLACEHOLDER (cad_tools.dev.json body: 0.832 kg)
    offset_r: 0.05                       # PLACEHOLDER
  standoff_gang:
    dims: [0.10, 0.10, 0.015]            # PLACEHOLDER (4-finger gang over the standoff square)
    mass: 0.5                            # PLACEHOLDER
    offset_r: 0.0                        # PLACEHOLDER
  tool_carrier:
    dims: [0.06, 0.06, 0.03]             # PLACEHOLDER
    mass: 0.6                            # PLACEHOLDER
    offset_r: 0.0                        # PLACEHOLDER
  side_plate_pair:
    dims: [0.12, 0.14, 0.02]             # PLACEHOLDER (two 0.10 x 0.05 plates side by side)
    mass: 0.5                            # PLACEHOLDER
    offset_r: 0.0                        # PLACEHOLDER

# SCARA bases: offset [dx, dy, dz, yaw] in the station frame; yaw points j1 = 0 at the line.
scaras:
  scara_build_frame:
    offset: [0.0, -0.45, 0.0, 1.570796]  # PLACEHOLDER (beside the belt on -y, facing +y)
  scara_install_standoffs:
    offset: [0.0, 0.55, 0.0, -1.570796]  # PLACEHOLDER (beyond its nest on +y)
  scara_place_pod:
    offset: [0.0, -0.55, 0.0, 1.570796]  # PLACEHOLDER (beyond buf_pod on -y)
  scara_fit_side_plates:
    offset: [0.0, 0.55, 0.0, -1.570796]  # PLACEHOLDER
  scara_fit_top_plate:
    offset: [0.0, 0.55, 0.0, -1.570796]  # PLACEHOLDER
scara_defaults:
  grip_s: 0.2                            # PLACEHOLDER
  release_s: 0.2                         # PLACEHOLDER
  settle_s: 0.1                          # PLACEHOLDER
  z_margin: 0.03                         # PLACEHOLDER
  # From the gantry spike (D-007: a 50 kg X axis lagged above half of a_max). It says nothing
  # about a SCARA's arm and must be re-derived for one before any time here is trusted (D-012).
  plan_speed_scale: 0.5                  # PLACEHOLDER
gang_heads:
  gh_arm_sandwich:
    stroke: 0.05                         # PLACEHOLDER
    v_max: 0.10                          # PLACEHOLDER (m/s, ram)
    a_max: 0.50                          # PLACEHOLDER (m/s^2, ram)
    drive_s: 3.0                         # PLACEHOLDER (s per pass)
    slide:
      # Sized from safe_z (D-013): the carrier's swept band reaches y = 0.21 m on +y (half-diagonal
      # 0.16 + tool offset_r 0.05), so the head (0.15 half-width) must wait at >= 0.36 m. At 0.35
      # it was under the band and safe_z needed 0.49 > z_stroke 0.30.
      stroke: 0.40                       # PLACEHOLDER
      t_in: 0.5                          # PLACEHOLDER
      t_out: 0.5                         # PLACEHOLDER
  gh_side_plates:
    spindles: 4                          # PLACEHOLDER
    stroke: 0.05                         # PLACEHOLDER
    v_max: 0.10                          # PLACEHOLDER (m/s, ram)
    a_max: 0.50                          # PLACEHOLDER (m/s^2, ram)
    drive_s: 3.0                         # PLACEHOLDER (s per pass)
    slide:
      stroke: 0.25                       # PLACEHOLDER
      t_in: 0.5                          # PLACEHOLDER
      t_out: 0.5                         # PLACEHOLDER
  gh_seat_esc:
    spindles: 4                          # PLACEHOLDER (one per screw, seat_esc qty)
    stroke: 0.05                         # PLACEHOLDER
    v_max: 0.10                          # PLACEHOLDER (m/s, ram)
    a_max: 0.50                          # PLACEHOLDER (m/s^2, ram)
    drive_s: 3.0                         # PLACEHOLDER (s per pass)
  gh_top_plate:
    spindles: 5                          # PLACEHOLDER (one per screw, drive_top_plate qty)
    stroke: 0.05                         # PLACEHOLDER
    v_max: 0.10                          # PLACEHOLDER (m/s, ram)
    a_max: 0.50                          # PLACEHOLDER (m/s^2, ram)
    drive_s: 3.0                         # PLACEHOLDER (s per pass)
    slide:
      stroke: 0.25                       # PLACEHOLDER
      t_in: 0.5                          # PLACEHOLDER
      t_out: 0.5                         # PLACEHOLDER

conveyor:
  pitch: 0.6                             # PLACEHOLDER

# Pallet top = top_height + thickness = work_height, so it is the datum plane. A feeder or buffer
# reaches from the floor to its pick plane: h = work_height + pose z. Magazines are 194 mm square
# (reports/cad_magazines.dev.json).
layout:
  conveyor:
    width: 0.30                          # PLACEHOLDER
    top_height: 0.93                     # PLACEHOLDER
    belt_speed: 0.3                      # PLACEHOLDER
  pallet_block:
    length: 0.20                         # PLACEHOLDER (tools/cad/pallet.py body)
    width: 0.20                          # PLACEHOLDER
    thickness: 0.02                      # PLACEHOLDER
  stop_unit_length: 0.30                 # PLACEHOLDER
  stop_unit_cycle_s: 1.0                 # PLACEHOLDER
  buffer_slots_between_stations: 1       # PLACEHOLDER
  scara_base:
    diameter: 0.20                       # PLACEHOLDER
    height: 1.25                         # PLACEHOLDER (floor to the shoulder, 0.3 m over the datum)
  gang_head_box: [0.30, 0.30, 0.20]      # PLACEHOLDER (the xacro's head body envelope)
  feeder_footprints:
    fd_mid_plate: [0.194, 0.194, 1.05]   # PLACEHOLDER
    fd_top_plate: [0.194, 0.194, 1.05]   # PLACEHOLDER
    fd_side_plate: [0.114, 0.064, 1.12]  # PLACEHOLDER
    fd_standoff: [0.18, 0.18, 1.10]      # PLACEHOLDER
    buf_spider: [0.18, 0.18, 1.05]       # PLACEHOLDER
    buf_pod: [0.18, 0.18, 1.05]          # PLACEHOLDER
    buf_plate: [0.18, 0.18, 1.05]        # PLACEHOLDER
  operator_aisle:
    side: "+y"                           # PLACEHOLDER (feeders are refilled from +y)
    width: 1.0                           # PLACEHOLDER
  guard_offset: 0.3                      # PLACEHOLDER
stations:
  st_build_frame:
    anchor: {gap: 1.0}                   # PLACEHOLDER (A's cell: reach 0.7 m about a base at -0.45)
  st_install_standoffs:
    anchor: {gap: 1.0}                   # PLACEHOLDER
  st_seat_esc:
    anchor: {gap: 0.6}                   # PLACEHOLDER
  st_place_pod:
    anchor: {gap: 0.6}                   # PLACEHOLDER
  st_fit_side_plates:
    anchor: {gap: 0.6}                   # PLACEHOLDER
  st_mount_servo:
    anchor: {gap: 0.6}                   # PLACEHOLDER
  st_fit_top_plate:
    anchor: {gap: 0.6}                   # PLACEHOLDER

# Entries match the base sequence by position (`id` is checked).
sequence:
  - id: load_pallet
    duration_s: 6.0                      # PLACEHOLDER
  - id: extend_pins
    duration_s: 0.5                      # PLACEHOLDER (pin cylinders out; counted in station_time)
  - id: place_spider
    duration_s: 4.0                      # PLACEHOLDER
  - id: place_mid_plate
    duration_s: 4.0                      # PLACEHOLDER
  - id: drive_arm_sandwich
    duration_s: 4.0                      # PLACEHOLDER (one pass + slide in/out)
  - id: install_standoffs
    duration_s: 12.0                     # PLACEHOLDER
  - id: seat_esc
    duration_s: 10.0                     # PLACEHOLDER
  - id: place_pod
    duration_s: 9.0                      # PLACEHOLDER
  - id: place_side_plates
    duration_s: 4.0                      # PLACEHOLDER (one pair pick, like place_top_plate)
  - id: fit_side_plates
    duration_s: 14.0                     # PLACEHOLDER
    qty: 8                               # PLACEHOLDER
  - id: mount_servo
    duration_s: 5.0                      # PLACEHOLDER
  - id: place_top_plate
    duration_s: 4.0                      # PLACEHOLDER (was fit_top_plate 14 s, split)
  - id: drive_top_plate
    duration_s: 10.0                     # PLACEHOLDER
