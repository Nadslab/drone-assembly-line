  - id: seat_esc
    duration_s: 10.0                     # PLACEHOLDER
  - id: place_pod
    duration_s: 9.0                      # PLACEHOLDER
  - id: fit_side_plates
    duration_s: 14.0                     # PLACEHOLDER
