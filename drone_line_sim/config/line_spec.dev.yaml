# Dev overlay for line_spec.yaml. Loaded only with --dev (load_spec(dev=True)).
#
# Same structure as the base spec, but it holds ONLY placeholders for values that are null (or
# absent optional fields) there. A value that is not null in line_spec.yaml always wins, so
# nothing here can override a real number. Every placeholder carries "# PLACEHOLDER"; delete
# the line once the real value lands in line_spec.yaml. No deliverable number may come from
# this file (see CLAUDE.md). `null` inside a list means "no opinion for this element".
#
# Layout assumptions (D-013: everything is an anchor gap or an offset in a station's frame, the
# poses are derived): stations on a straight line along +x from station 1 (the origin, y = 0).
# Every working station is one cell in the same pattern: its SCARA stands 0.45 m out on -y facing
# the line, its sources (and its return chute) 0.35 m either side of it in x, 0.25 m out on -y,
# and its gang head waits on its slide on +y. Gaps: 1.4 m inside a milestone (2 x the 0.7 m
# reach: no shared reach zone), 2.0 m across a milestone boundary (the partition wall stands
# guard_offset clear of both envelopes). Every offset z is on the datum plane, so
# `line.work_height` alone says how high the line stands.

line:
  work_height: 0.95                      # PLACEHOLDER

parts:
  bottom_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    # Four arms on the plate diagonals, two screws each at r = 55 and 75 mm from the plate
    # centre (the datum midpoint, 45 mm out on +x). Listed arm by arm, but the generator
    # groups them by angle and never relies on the order.
    arm_holes:
      positions:
        - [0.083891, 0.038891]           # PLACEHOLDER
        - [0.098033, 0.053033]           # PLACEHOLDER
        - [0.006109, 0.038891]           # PLACEHOLDER
        - [-0.008033, 0.053033]          # PLACEHOLDER
        - [0.006109, -0.038891]          # PLACEHOLDER
        - [-0.008033, -0.053033]         # PLACEHOLDER
        - [0.083891, -0.038891]          # PLACEHOLDER
        - [0.098033, -0.053033]          # PLACEHOLDER
  mid_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.03                     # PLACEHOLDER
    lead_slot: [0.006, 0.012]            # PLACEHOLDER
  top_plate:
    envelope: [0.18, 0.18, 0.003]        # PLACEHOLDER
    mass: 0.04                           # PLACEHOLDER
    datums:
      round: [0.0, 0.0]                  # PLACEHOLDER
      diamond: [0.09, 0.0]               # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    z_in_stack: 0.06                     # PLACEHOLDER
  side_plate:
    envelope: [0.10, 0.05, 0.003]        # PLACEHOLDER
    mass: 0.02                           # PLACEHOLDER
    pick: [null, null, 0.003, null]      # PLACEHOLDER
    key: [0.008, 0.008]                  # PLACEHOLDER
  standoff:
    dims: [0.003, 0.012]                 # PLACEHOLDER
    mass: 0.002                          # PLACEHOLDER
  arm:
    dims: [0.16, 0.02, 0.008]            # PLACEHOLDER
    mass: 0.09                           # PLACEHOLDER
    hole_inset: 0.02                     # PLACEHOLDER
  esc:
    dims: [0.04, 0.04, 0.012]            # PLACEHOLDER
    mass: 0.03                           # PLACEHOLDER
    z_in_stack: 0.045                    # PLACEHOLDER (standoff height above the mid plate)
  spider:
    dims: [0.18, 0.18, 0.03]             # PLACEHOLDER
    mass: 0.15                           # PLACEHOLDER
  pod:
    dims: [0.10, 0.08, 0.04]             # PLACEHOLDER
    mass: 0.12                           # PLACEHOLDER
  carrier_spider:
    mass: 0.3                            # PLACEHOLDER
  carrier_pod:
    mass: 0.2                            # PLACEHOLDER
  pallet:
    mass: 2.0                            # PLACEHOLDER

cad:
  press_nut_hole_d: 0.004                # PLACEHOLDER

# One tooling hole per arm at its root, on the arm axis 48 mm from the plate centre: the arm's
# inboard end is at 45 mm (holes at 55/75, hole_inset 20), and the nearest screw is 7 mm away,
# more than 2 x M3 (arm_pin_clearance).
drone:
  arm_tooling_holes:
    - [0.078941, 0.033941]               # PLACEHOLDER
    - [0.011059, 0.033941]               # PLACEHOLDER
    - [0.011059, -0.033941]              # PLACEHOLDER
    - [0.078941, -0.033941]              # PLACEHOLDER
  tooling_pin_d: 0.003                   # PLACEHOLDER
  pin_engagement: 0.002                  # PLACEHOLDER

feeders:
  fd_mid_plate:
    offset: [0.35, -0.25, 0.1, null]     # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_top_plate:
    offset: [0.35, -0.25, 0.1, null]     # PLACEHOLDER
    refill_s: 60.0                       # PLACEHOLDER
  fd_side_plate:
    offset: [0.35, -0.25, 0.17, null]    # PLACEHOLDER (218 mm magazine clears the frame top)
    refill_s: 60.0                       # PLACEHOLDER
  fd_standoff:
    offset: [0.35, -0.25, 0.15, null]    # PLACEHOLDER (nest pick plane)
    refill_s: 300.0                      # PLACEHOLDER
  fd_screw_m3x8:
