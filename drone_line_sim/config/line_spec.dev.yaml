    pose: [0.0, 0.0, 0.0, null]          # PLACEHOLDER
  st_place_spider:
    pose: [0.6, 0.0, 0.0, null]          # PLACEHOLDER
  st_place_mid_plate:
    pose: [1.2, 0.0, 0.0, null]          # PLACEHOLDER
