  scara_fit_pod:
    offset: [0.0, -0.45, 0.0, 1.570796]  # PLACEHOLDER
    park_pose: {j1: -0.9599, j2: 2.617994}    # PLACEHOLDER (auto-chosen) j1 -55°, j2 150°, clears 52 mm
  scara_fit_side_plates:
    offset: [0.0, -0.45, 0.0, 1.570796]  # PLACEHOLDER
    park_pose: {j1: -0.9599, j2: 2.617994}    # PLACEHOLDER (auto-chosen) j1 -55°, j2 150°, clears 55 mm
