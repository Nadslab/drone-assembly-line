conveyor:
  pitch: 0.6                             # PLACEHOLDER

# Pallet top = top_height + thickness = work_height, so it is the datum plane. A feeder or buffer
# reaches from the floor to its pick plane: h = work_height + pose z. Magazines are 194 mm square
# (reports/cad_magazines.dev.json).
layout:
  conveyor:
    width: 0.30                          # PLACEHOLDER
    top_height: 0.93                     # PLACEHOLDER
    belt_speed: 0.3                      # PLACEHOLDER
  pallet_block:
    length: 0.20                         # PLACEHOLDER (tools/cad/pallet.py body)
    width: 0.20                          # PLACEHOLDER
    thickness: 0.02                      # PLACEHOLDER
  stop_unit_length: 0.30                 # PLACEHOLDER
  stop_unit_cycle_s: 1.0                 # PLACEHOLDER
  buffer_slots_between_stations: 1       # PLACEHOLDER
  scara_base:
    diameter: 0.20                       # PLACEHOLDER
    height: 1.25                         # PLACEHOLDER (floor to the shoulder, 0.3 m over the datum)
  gang_head_box: [0.30, 0.30, 0.20]      # PLACEHOLDER (the xacro's head body envelope)
  feeder_footprints:
    fd_mid_plate: [0.194, 0.194, 1.05]   # PLACEHOLDER
    fd_top_plate: [0.194, 0.194, 1.05]   # PLACEHOLDER
    fd_side_plate: [0.114, 0.064, 1.12]  # PLACEHOLDER
    fd_standoff: [0.18, 0.18, 1.10]      # PLACEHOLDER
    buf_spider: [0.18, 0.18, 1.05]       # PLACEHOLDER
    buf_pod: [0.18, 0.18, 1.05]          # PLACEHOLDER
    buf_plate: [0.18, 0.18, 1.05]        # PLACEHOLDER
  operator_aisle:
